name: CPU regression

on:
  pull_request:
  push:
    branches: [beijing-d-collect]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python -B tools/check_assets.py --runtime runtime
      - run: bash -n run.sh run_long_batch.sh tools/reproduce_shared.sh
      - run: python -B tools/package.py --output "$RUNNER_TEMP/graspgen_curobo_collect.tar.gz"
